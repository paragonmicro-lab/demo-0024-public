# CentOS Stream 9 VM from Red Hat's centos-stream9-server-small template: the console steps of Demo 1 Bonus C, as code.
# Exported from the console (instructor, 0024-006, 2026-10-06), then stripped of everything the cluster generates
# (uid, resourceVersion, timestamps, managedFields, MAC address, firmware serial) and of the password it held.
#
# Fill in and apply (envsubst is in gettext):
#   export NAME="$VMNS-centos9"                       # e.g. student-03-0024-006-centos9
#   export VLAN=$((22 + N))                           # your vSphere zone's VLAN: lz1 → 23
#   export VIP="10.101.$VLAN.$((150 + 10#${WINUSER#student-}))"   # a static address on that VLAN (no lab DHCP)
#   export SC=nfs-csi                                 # or ocs-storagecluster-ceph-rbd-virtualization on an ODF site
#   export SSH_PUBKEY="$(cat ~/.ssh/id_ed25519.pub)"  # log in with your key (no password in a file)
#   envsubst < class/examples/centos9-vm-from-template.yaml | oc --context site-a -n "$VMNS" apply -f -
#
# What each part does (console step in brackets):
#   dataVolumeTemplates[0]  root disk cloned from Red Hat's centos-stream9 boot source   [the template's disk source]
#   dataVolumeTemplates[1]  a 10 GiB blank data disk                                     [Customize → Disks → Add disk]
#   interfaces + networks   the NIC on your VLAN's bridge, not the pod network          [Network interfaces → Edit → vmnet23]
#   cloudinitdisk           login user + key, and the static address on the VLAN        [Scripts → Cloud-init]
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: ${NAME}
  labels:
    app: ${NAME}
    vm.kubevirt.io/template: centos-stream9-server-small
    vm.kubevirt.io/template.namespace: openshift
spec:
  runStrategy: RerunOnFailure                          # [Start this VirtualMachine after creation]
  dataVolumeTemplates:
    - apiVersion: cdi.kubevirt.io/v1beta1
      kind: DataVolume
      metadata:
        name: ${NAME}
      spec:
        sourceRef:                                     # Red Hat's boot source: a CentOS Stream 9 cloud image on the cluster
          kind: DataSource
          name: centos-stream9
          namespace: openshift-virtualization-os-images
        storage:
          resources:
            requests:
              storage: 30Gi
    - metadata:
        name: ${NAME}-data
      spec:
        source:
          blank: {}                                    # an empty disk
        storage:
          storageClassName: ${SC}
          # The console's defaults were Block + ReadWriteOnce (flagged "Not recommended" for nfs-csi). Filesystem +
          # ReadWriteMany is what nfs-csi wants, and RWX lets the VM live-migrate (Bonus A). On ODF: Block + RWX.
          volumeMode: Filesystem
          accessModes: [ReadWriteMany]
          resources:
            requests:
              storage: 10Gi
  template:
    metadata:
      annotations:
        vm.kubevirt.io/flavor: small
        vm.kubevirt.io/os: centos-stream9
        vm.kubevirt.io/workload: server
      labels:
        kubevirt.io/domain: ${NAME}
        kubevirt.io/size: small
    spec:
      domain:
        cpu: { cores: 1, sockets: 1, threads: 1 }
        memory: { guest: 2Gi }
        devices:
          disks:
            - { name: rootdisk,      disk: { bus: virtio } }
            - { name: cloudinitdisk, disk: { bus: virtio } }
            - { name: datadisk,      disk: { bus: virtio } }   # appears in the guest as /dev/vdc
          interfaces:
            - name: default
              bridge: {}                               # bridged onto the VLAN (the pod network would be masquerade: {})
              model: virtio
          rng: {}
      networks:
        - name: default
          multus:
            networkName: default/vmnet${VLAN}          # the NAD on your VLAN's bridge (lives in namespace default)
      terminationGracePeriodSeconds: 180
      volumes:
        - name: rootdisk
          dataVolume: { name: "${NAME}" }
        - name: datadisk
          dataVolume: { name: "${NAME}-data" }
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |-
              #cloud-config
              user: centos
              ssh_authorized_keys:
                - ${SSH_PUBKEY}
            networkData: |-
              version: 2
              ethernets:
                eth0:
                  addresses: [ ${VIP}/24 ]
                  gateway4: 10.101.${VLAN}.1
                  nameservers: { addresses: [ 10.101.6.201, 10.101.6.202 ] }
