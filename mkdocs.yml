# The public class site (BL-D14). class_site.py copies this next to the assembled docs/ and builds it with
# `mkdocs build --strict`: a broken link or a page missing from nav fails the publish.
site_name: "VMware to OpenShift Virtualization: student guide"
site_description: "Migrate, move and protect your VM: the class guides for the Paragon Micro lab (demo-0024)"
site_url: !ENV [CLASS_SITE_URL, ""]
docs_dir: docs
use_directory_urls: false          # keeps every guide's relative links (../.images/x.mp4, lab-diagram.md#…) as they are in git
exclude_docs: |                    # MkDocs skips dot-folders by default; .images/ holds the 🎬 recordings and screenshots
  !.images/
copyright: "Paragon Micro lab · generated from the class source; changes made here are overwritten"

theme:
  name: material
  # no Paragon logo/favicon: demo-0024 is not a Paragon-branded class (operator, 2026-10-12); the lab look stays
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - content.code.copy            # a copy button on every command block
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom                  # colours from brand/paragon.css (the lab look)
      accent: custom
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Light mode }

extra_css:
  - brand/class.css                    # the layout (Start here splash, step cards): core-web docs/class-site-kit
  - brand/paragon.css                  # the lab look (colours + fonts): the default on every class site, not a logo

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.highlight: { anchor_linenums: false }
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - { name: mermaid, class: mermaid, format: !!python/name:pymdownx.superfences.fence_code_format }

validation:
  links:
    not_found: warn                # --strict turns these into failures
    anchors: info                  # GitHub-style anchors (emoji, punctuation) differ from MkDocs' slugs: reported, not fatal
  nav:
    omitted_files: warn            # a published page missing from nav: --strict fails it (core-web kit parity)

# A Paragon-branded class gets the Paragon class banner (class/site/paragon-banner.md) under the Start here hero.
extra:
  paragon_branded: false

# The lab-standard ORDER (core-web docs/class-sites.md): Start here → Student guide → Labs → Downloads → Get help →
# Reference. Our labs are grouped (operator, 2026-10-12): the CORE migration class, then optional groups a class can go
# deeper into (Storage, Backup, More demos). Other storage or backup vendors are forks of this project, not tracks (BL-D25).
nav:
  - "Start here": index.md
  - "Student guide": student-guide.md
  - "Core: VMware → OpenShift":
      - "Lab 0: Access and tools": demos/00-access-and-tools.md
      - "Demo 1: Cold migration": demos/01-vmware-to-ove-cold.md
      - "Demo 2: Warm migration": demos/02-vmware-to-ove-warm.md
  - "Storage":
      - "Demo 4: ODF Regional-DR": demos/04-odf-regional-dr.md
  - "Backup":
      - "Demo 5: OADP backup and restore (bonus)": demos/05-oadp-vm-backup.md
  - "More demos":
      - "Demo 1b: VMware → both clusters": demos/01b-vmware-to-both-sites.md
      - "Demo 3: OpenShift → OpenShift": demos/03-ove-to-ove-cold.md
  - "Downloads": downloads.md
  - "Get help": help.md
  - "Reference":
      - "Toolkit: your terminal and data": demos/toolkit.md
      - "Lab S: how this lab was built": demos/setup-how-the-lab-is-built.md
      - "Lab diagram": demos/lab-diagram.md
